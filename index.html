<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Perfect Circle</title>
<meta name="theme-color" content="#d8f3e4">
<meta name="description" content="Draw a circle. How perfect is it?">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='none' stroke='%231f3a93' stroke-width='3'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #d8f3e4; /* mint green */
    --line: #b9e0cc;
    --margin: #f0b4b4;
    --ink: #1f3a93;
    --text: #2b2b2b;
    --muted: #7a7466;
    --hand: "Caveat", "Comic Sans MS", "Segoe Print", cursive;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--text);
    font-family: var(--hand);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  /* Ruled notebook paper */
  .paper {
    position: fixed; inset: 0;
    background:
      linear-gradient(90deg, transparent 63px, var(--margin) 63px, var(--margin) 65px, transparent 65px),
      repeating-linear-gradient(transparent 0 31px, var(--line) 31px 32px);
  }
  canvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    touch-action: none;
    cursor: crosshair;
  }
  header {
    position: fixed; top: 0; left: 0; right: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 0 84px;
    pointer-events: none;
  }
  h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.2rem); font-weight: 700; line-height: 1; }
  .best { font-size: 1.4rem; color: var(--muted); margin-top: 4px; }
  .linkish {
    pointer-events: auto;
    font: inherit; color: var(--ink);
    background: none; border: 0; padding: 0 2px;
    text-decoration: underline; text-underline-offset: 3px;
    cursor: pointer;
  }
  .trophy {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 14px); right: 16px;
    font: 700 1.5rem var(--hand);
    color: var(--text);
    background: #fff8d6;
    border: 2px solid var(--text);
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px; /* wobbly hand-drawn box */
    padding: 4px 14px;
    cursor: pointer;
    box-shadow: 2px 3px 0 var(--text);
  }
  @media (max-width: 560px) {
    .trophy .label { display: none; }
    header { padding-right: 76px; }
  }
  .trophy:active, .sound:active { transform: translate(2px, 3px); box-shadow: none; }
  .sound {
    position: fixed;
    right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    font: 700 1.4rem var(--hand);
    color: var(--text);
    background: #fff8d6;
    border: 2px solid var(--text);
    border-radius: 15px 225px 15px 255px / 255px 15px 225px 15px;
    padding: 2px 12px;
    cursor: pointer;
    box-shadow: 2px 3px 0 var(--text);
  }

  dialog {
    font-family: var(--hand);
    color: var(--text);
    background: var(--paper);
    border: 3px solid var(--text);
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
    box-shadow: 4px 6px 0 var(--text);
    padding: 24px 28px;
    width: min(440px, calc(100vw - 32px));
  }
  dialog::backdrop { background: rgba(40, 35, 20, .35); }
  dialog h2 { margin: 0 0 8px; font-size: 2.2rem; line-height: 1.1; }
  dialog p { margin: 0 0 14px; font-size: 1.35rem; color: var(--muted); }
  dialog input {
    width: 100%;
    font: 700 1.8rem var(--hand);
    color: var(--ink);
    background: transparent;
    border: 0; border-bottom: 3px solid var(--ink);
    padding: 4px 2px; outline: none;
  }
  .actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 18px; }
  .btn {
    font: 700 1.5rem var(--hand);
    color: #fff; background: var(--ink);
    border: 0; border-radius: 12px 4px 12px 4px;
    padding: 6px 20px; cursor: pointer;
  }
  .btn.ghost { color: var(--ink); background: transparent; }

  .board { list-style: none; margin: 0; padding: 0; font-size: 1.35rem; }
  .board li {
    display: grid;
    grid-template-columns: 2.2em 1fr auto;
    align-items: baseline;
    gap: 0 8px;
    padding: 5px 0;
    border-bottom: 1px dashed var(--line);
  }
  .board .rank { font-weight: 700; font-size: 1.6rem; }
  .board .who { min-width: 0; overflow-wrap: anywhere; }
  .board .name { font-weight: 700; }
  .board .title { display: block; color: var(--muted); font-size: 1.15rem; line-height: 1; }
  .board .pts { font-weight: 700; font-variant-numeric: tabular-nums; }
  .board .me { background: #fff3b0; }
  .board li:nth-child(1) .rank { color: #c9a100; }
  .board li:nth-child(2) .rank { color: #8a8f99; }
  .board li:nth-child(3) .rank { color: #b26a2e; }
  .empty { font-size: 1.35rem; color: var(--muted); }
  .rankup { color: var(--ink); font-weight: 700; }
  .center {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    pointer-events: none;
    text-align: center;
    padding: 16px;
  }
  .score {
    font-size: clamp(4rem, 18vw, 9rem);
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    transition: color .2s;
  }
  .message { font-size: clamp(1.5rem, 5vw, 2.4rem); margin-top: 6px; min-height: 1.3em; }
  .hint { font-size: clamp(1.6rem, 5vw, 2.4rem); color: var(--muted); }
  .hint .arrow { display: inline-block; animation: wiggle 1.6s ease-in-out infinite; }
  @keyframes wiggle { 50% { transform: rotate(25deg); } }
  .pop { animation: pop .35s ease-out; }
  @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }
  footer {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 0 84px calc(env(safe-area-inset-bottom, 0px) + 12px) 84px;
    font-size: 1.2rem; color: var(--muted);
    pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) {
    .hint .arrow, .pop { animation: none; }
  }
</style>
</head>
<body>
  <div class="paper" aria-hidden="true"></div>
  <canvas id="board" aria-label="Drawing area: draw a circle here"></canvas>

  <header>
    <h1>The Perfect Circle</h1>
    <div class="best">
      Playing as <button class="linkish" id="who" type="button" aria-label="Change name"></button>
      <span id="best"></span>
    </div>
  </header>
  <button class="trophy" id="trophyBtn" type="button" aria-label="Top 10 leaderboard">🏆<span class="label"> Top 10</span></button>

  <dialog id="nameDialog">
    <form id="nameForm">
      <h2>Who's drawing?</h2>
      <p>Your name goes on the leaderboard.</p>
      <input id="nameInput" maxlength="20" autocomplete="nickname" required placeholder="Your name" aria-label="Your name">
      <div class="actions"><button class="btn" type="submit">Let's go!</button></div>
    </form>
  </dialog>

  <dialog id="boardDialog">
    <h2>🏆 Hall of Circles</h2>
    <p>The 10 roundest artists on this device.</p>
    <ol class="board" id="boardList"></ol>
    <div class="actions"><button class="btn" id="boardClose" type="button">Close</button></div>
  </dialog>

  <div class="center">
    <div>
      <div class="hint" id="hint">Draw a circle. As perfect as you can. <span class="arrow">↻</span></div>
      <div class="score" id="score" hidden></div>
      <div class="message" id="message" aria-live="polite"></div>
    </div>
  </div>

  <button class="sound" id="soundBtn" type="button"></button>

  <footer>Tip: one smooth stroke, all the way round.</footer>

<script src="score.js"></script>
<script src="leaderboard.js"></script>
<script src="sound.js"></script>
<script>
(() => {
  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const hintEl = document.getElementById("hint");
  const scoreEl = document.getElementById("score");
  const msgEl = document.getElementById("message");
  const bestEl = document.getElementById("best");

  const whoEl = document.getElementById("who");
  const nameDialog = document.getElementById("nameDialog");
  const nameForm = document.getElementById("nameForm");
  const nameInput = document.getElementById("nameInput");
  const boardDialog = document.getElementById("boardDialog");
  const boardEl = document.getElementById("boardList");
  const LB = window.Leaderboard;
  const SFX = window.Sound;
  const soundBtn = document.getElementById("soundBtn");
  function showSound() {
    soundBtn.textContent = SFX.muted ? "🔇" : "🔊";
    soundBtn.setAttribute("aria-label", SFX.muted ? "Turn sound on" : "Turn sound off");
    soundBtn.setAttribute("aria-pressed", String(!SFX.muted));
  }
  soundBtn.addEventListener("click", () => { SFX.toggleMute(); showSound(); });
  showSound();
  // Touching localStorage can itself throw (blocked site data), so grab it once safely.
  const store = (() => { try { return window.localStorage; } catch { return null; } })();

  let points = [];
  let drawing = false;
  let players = LB.load(store);
  let player = "";
  try { player = store.getItem("perfect-circle-name") || ""; } catch {}

  const messages = [
    [99,  ["Are you a compass?", "Witchcraft. Pure witchcraft.", "Giotto would weep."]],
    [95,  ["Chef's kiss.", "Basically a pizza.", "Your geometry teacher is proud."]],
    [90,  ["Very round. Very nice.", "That's a respectable circle.", "Almost suspicious."]],
    [80,  ["Pretty round!", "A solid donut.", "Not bad at all."]],
    [70,  ["A potato, but a round one.", "Circle-ish.", "It has circle energy."]],
    [50,  ["That's an egg.", "Lumpy, but brave.", "Abstract art?"]],
    [0,   ["Is that a circle? Be honest.", "Squares are cool too.", "Did you sneeze?"]],
  ];
  const reasons = {
    tooSmall: "Too small! Go bigger.",
    notClosed: "Go all the way round!",
    tooShort: "That was barely a dot.",
  };

  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const messageFor = (s) => pick(messages.find(([min]) => s >= min)[1]);

  // Red (bad) → amber → green (good)
  const colorFor = (s) => `hsl(${Math.max(0, Math.min(120, (s - 40) * 2))}, 70%, 38%)`;

  function showBest() {
    whoEl.textContent = player || "…";
    const best = player ? LB.bestOf(players, player) : 0;
    bestEl.textContent = best > 0 ? `· Best: ${best.toFixed(1)}%` : "";
  }

  function askName() {
    nameInput.value = player;
    nameDialog.showModal();
    nameInput.select();
  }
  nameForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const name = nameInput.value.trim();
    if (!name) return;
    player = name;
    try { store.setItem("perfect-circle-name", player); } catch {}
    nameDialog.close();
    SFX.click();
    showBest();
  });
  // Escape only closes the name box if we already have a name.
  nameDialog.addEventListener("cancel", (e) => { if (!player) e.preventDefault(); });
  whoEl.addEventListener("click", askName);

  function showBoard() {
    const top = LB.top10(players);
    boardEl.replaceChildren();
    if (!top.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "Nobody yet. Be the first!";
      boardEl.append(li);
    }
    for (const p of top) {
      const li = document.createElement("li");
      if (player && p.name.toLowerCase() === player.toLowerCase()) li.className = "me";
      const rank = document.createElement("span");
      rank.className = "rank";
      rank.textContent = `#${p.rank}`;
      const who = document.createElement("span");
      who.className = "who";
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = p.name; // textContent: names are never treated as HTML
      const title = document.createElement("span");
      title.className = "title";
      title.textContent = p.title;
      who.append(name, title);
      const pts = document.createElement("span");
      pts.className = "pts";
      pts.textContent = `${p.score.toFixed(1)}%`;
      li.append(rank, who, pts);
      boardEl.append(li);
    }
    boardDialog.showModal();
  }
  document.getElementById("trophyBtn").addEventListener("click", showBoard);
  document.getElementById("boardClose").addEventListener("click", () => boardDialog.close());
  boardDialog.addEventListener("click", (e) => { if (e.target === boardDialog) boardDialog.close(); });

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redraw();
  }

  const minRadius = () => Math.max(30, Math.min(innerWidth, innerHeight) * 0.08);

  function redraw(result) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    if (points.length < 2) return;

    // The ideal circle, faintly, once the stroke is done.
    if (result && result.radius && !result.reason) {
      ctx.save();
      ctx.setLineDash([6, 8]);
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(0,0,0,.18)";
      ctx.beginPath();
      ctx.arc(result.center.x, result.center.y, result.radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // The stroke, coloured per segment by how far it strays from the fitted circle.
    const fit = result && result.radius ? result : window.scoreCircle(points, { minRadius: 0 });
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = 6;
    for (let i = 1; i < points.length; i++) {
      const p = points[i];
      let color = "#1f3a93";
      if (fit && fit.radius) {
        const d = Math.abs(Math.hypot(p.x - fit.center.x, p.y - fit.center.y) - fit.radius) / fit.radius;
        color = colorFor(100 - d * 600);
      }
      ctx.strokeStyle = color;
      ctx.beginPath();
      ctx.moveTo(points[i - 1].x, points[i - 1].y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }
  }

  function setScore(s, live) {
    scoreEl.hidden = false;
    scoreEl.textContent = `${s.toFixed(1)}%`;
    scoreEl.style.color = colorFor(s);
    if (!live) {
      scoreEl.classList.remove("pop");
      void scoreEl.offsetWidth; // restart the animation
      scoreEl.classList.add("pop");
    }
  }

  function start(e) {
    drawing = true;
    canvas.setPointerCapture(e.pointerId);
    points = [{ x: e.clientX, y: e.clientY }];
    hintEl.hidden = true;
    scoreEl.hidden = true;
    msgEl.textContent = "";
    SFX.drawStart();
    redraw();
  }

  function move(e) {
    if (!drawing) return;
    const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    const prev = points[points.length - 1];
    for (const ev of events) points.push({ x: ev.clientX, y: ev.clientY });
    const last = points[points.length - 1];
    let liveScore = null;
    redraw();
    // Live score once there's enough of a stroke to judge.
    if (points.length > 20) {
      const r = window.scoreCircle(points, { minRadius: minRadius() });
      if (r.radius && r.reason !== "tooSmall") {
        // While drawing, only roundness counts — closing comes at the end.
        const live = Math.max(0, Math.min(100, 100 - (r.deviation ?? liveDeviation(r)) * 600));
        setScore(live, true);
        liveScore = live;
      }
    }
    SFX.drawUpdate(Math.hypot(last.x - prev.x, last.y - prev.y), liveScore);
  }

  function liveDeviation(r) {
    const ds = points.map((p) => Math.hypot(p.x - r.center.x, p.y - r.center.y));
    return ds.reduce((a, d) => a + Math.abs(d - r.radius), 0) / ds.length / r.radius;
  }

  function end() {
    if (!drawing) return;
    drawing = false;
    SFX.drawStop();
    const r = window.scoreCircle(points, { minRadius: minRadius() });
    redraw(r);
    if (r.reason) {
      scoreEl.hidden = true;
      msgEl.textContent = reasons[r.reason];
      SFX.fail();
      return;
    }
    setScore(r.score);
    SFX.score(r.score);
    const hadBest = LB.bestOf(players, player) > 0;
    const res = LB.record(players, player, Math.round(r.score * 10) / 10);
    players = res.players;
    LB.save(store, players);
    showBest();

    msgEl.replaceChildren();
    if (res.improved && res.rank) {
      const up = document.createElement("div");
      up.className = "rankup";
      up.textContent = `#${res.rank} — you are now ${res.title}!`;
      msgEl.append(up);
    }
    if (res.improved && (hadBest || res.rank)) SFX.fanfare();
    msgEl.append((res.improved && hadBest ? "New best! " : "") + messageFor(r.score));
  }

  canvas.addEventListener("pointerdown", start);
  canvas.addEventListener("pointermove", move);
  canvas.addEventListener("pointerup", end);
  canvas.addEventListener("pointercancel", end);
  addEventListener("resize", resize);

  showBest();
  resize();
  askName();
})();
</script>
</body>
</html>
